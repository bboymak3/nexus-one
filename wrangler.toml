# Cloudflare Pages configuration for Nexus One
pages_build_output_dir = ".vercel/output/static"

name = "nexus-one"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 compartida por nexus-one (tablas nx_) y el POS (tablas pos_), cuenta bboymak3
d1_databases = [
  { binding = "DB", database_name = "ok_db", database_id = "f4939ecd-22e5-4f7c-b2f5-8861997cb042" }
]

[vars]
NODE_ENV = "production"
# URL publica del POS compartido (MyeCommerce), sin barra final.
# Va aqui y no en el panel: con wrangler.toml, Cloudflare ignora las variables
# normales definidas en el panel (los secretos si se respetan).
MYECOMMERCE_URL = "https://myecommerce-pos-7g0.pages.dev"

# Secretos (NO van en este archivo). Mientras JWT_SECRET no exista se usa la clave
# anterior; el boton "Abrir Punto de Venta" requiere NEXUS_SSO_SECRET. Configurar con:
#   npx wrangler pages secret put JWT_SECRET --project-name=nexus-one
#   npx wrangler pages secret put NEXUS_SSO_SECRET --project-name=nexus-one            (mismo valor que en myecommerce-pos)
#   npx wrangler pages secret put SUPERADMIN_INITIAL_PASSWORD --project-name=nexus-one (solo para el primer login)
